<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Tarshid</title>
<style>
  /* ============================================================
     DESIGN TOKENS — unified with index.html
     ============================================================ */
  :root {
    --bg: #f6f8fb;
    --bg-grad-1: rgba(99, 102, 241, 0.08);
    --bg-grad-2: rgba(16, 185, 129, 0.06);
    --surface: #ffffff;
    --surface-2: #f3f5fa;
    --surface-3: #eaeef5;
    --text: #1a1f36;
    --text-2: #475569;
    --muted: #64748b;
    --soft: #94a3b8;
    --border: #e6e9ef;
    --border-strong: #d6dbe4;
    --border-focus: rgba(99, 102, 241, 0.45);
    --shadow-xs: 0 1px 2px rgba(20, 24, 50, 0.04);
    --shadow-sm: 0 2px 6px rgba(20, 24, 50, 0.06), 0 1px 2px rgba(20, 24, 50, 0.04);
    --shadow-md: 0 8px 18px rgba(20, 24, 50, 0.08), 0 3px 6px rgba(20, 24, 50, 0.04);
    --accent: #6366f1;
    --accent-2: #4f46e5;
    --accent-soft: rgba(99, 102, 241, 0.12);
    --accent-ring: rgba(99, 102, 241, 0.22);
    --on: #10b981;
    --on-2: #059669;
    --on-soft: rgba(16, 185, 129, 0.14);
    --off: #ef4444;
    --off-soft: rgba(239, 68, 68, 0.12);
    --warn: #f59e0b;
    --warn-soft: rgba(245, 158, 11, 0.16);
    --error: #ef4444;
    --radius-xs: 8px;
    --radius-sm: 10px;
    --radius: 14px;
    --radius-lg: 18px;
    --radius-xl: 22px;
    --radius-pill: 999px;
  }

  [data-theme="dark"] {
    --bg: #0a0f1c;
    --bg-grad-1: rgba(99, 102, 241, 0.16);
    --bg-grad-2: rgba(16, 185, 129, 0.08);
    --surface: #131a2b;
    --surface-2: #1c2538;
    --surface-3: #232e44;
    --text: #f1f5f9;
    --text-2: #cbd5e1;
    --muted: #94a3b8;
    --soft: #64748b;
    --border: #232c40;
    --border-strong: #344056;
    --border-focus: rgba(129, 140, 248, 0.55);
    --shadow-xs: 0 1px 2px rgba(0, 0, 0, 0.5);
    --shadow-sm: 0 2px 6px rgba(0, 0, 0, 0.45);
    --shadow-md: 0 8px 18px rgba(0, 0, 0, 0.5);
    --accent: #818cf8;
    --accent-2: #6366f1;
    --accent-soft: rgba(129, 140, 248, 0.18);
    --accent-ring: rgba(129, 140, 248, 0.3);
    --on: #34d399;
    --on-2: #10b981;
    --on-soft: rgba(52, 211, 153, 0.18);
    --off: #f87171;
    --off-soft: rgba(248, 113, 113, 0.18);
    --warn: #fbbf24;
    --warn-soft: rgba(251, 191, 36, 0.2);
    --error: #f87171;
  }

  /* ============================================================
     BASE
     ============================================================ */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  *:focus-visible {
    outline: 3px solid var(--border-focus);
    outline-offset: 2px;
    border-radius: 6px;
  }

  body {
    font-family: "Inter", "SF Pro Text", "Segoe UI", system-ui, -apple-system, sans-serif;
    background: var(--bg);
    background-image:
      radial-gradient(1200px 700px at 0% -10%, var(--bg-grad-1), transparent 65%),
      radial-gradient(900px 500px at 100% 0%, var(--bg-grad-2), transparent 65%);
    background-attachment: fixed;
    color: var(--text);
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 40px;
    font-size: 16px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    transition: background 200ms ease, color 200ms ease;
  }

  /* ── Header bar ──────────────────────── */
  .topbar {
    width: 100%;
    max-width: 440px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-xl);
    box-shadow: var(--shadow-sm);
    margin-bottom: 24px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .brand-mark {
    width: 36px;
    height: 36px;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: grid;
    place-items: center;
    color: #fff;
  }

  .brand-mark .icon { width: 18px; height: 18px; }

  .brand-name {
    font-size: 1.1rem;
    font-weight: 900;
    letter-spacing: 0.18em;
    color: var(--accent);
  }

  .icon-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 14px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text-2);
    font-size: 0.82rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 160ms ease;
    min-height: 40px;
    touch-action: manipulation;
  }

  .icon-btn:hover {
    background: var(--surface-3);
    border-color: var(--border-strong);
  }

  .icon-btn .icon { width: 16px; height: 16px; }

  /* ── SVG icon defaults ───────────────── */
  .icon {
    width: 1em;
    height: 1em;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
    flex: 0 0 auto;
    display: inline-block;
    vertical-align: middle;
  }

  /* ── Connection pill ─────────────────── */
  .conn {
    font-size: 0.75rem;
    font-weight: 800;
    padding: 5px 14px;
    border-radius: var(--radius-pill);
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--muted);
    margin-bottom: 20px;
    transition: all 220ms ease;
    letter-spacing: 0.04em;
  }
  .conn.online {
    background: var(--on-soft);
    border-color: transparent;
    color: var(--on-2);
  }
  [data-theme="dark"] .conn.online { color: var(--on); }
  .conn.offline {
    background: var(--off-soft);
    border-color: transparent;
    color: var(--off);
  }

  /* ── Panel (card) ────────────────────── */
  .panel {
    width: 100%;
    max-width: 440px;
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: var(--radius-xl);
    padding: 22px 24px;
    box-shadow: var(--shadow-sm);
    margin-bottom: 18px;
  }

  .panel-head {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 18px;
  }

  .panel-icon {
    width: 38px;
    height: 38px;
    border-radius: 12px;
    display: grid;
    place-items: center;
    background: var(--accent-soft);
    color: var(--accent);
    flex: 0 0 auto;
  }

  .panel-icon .icon { width: 18px; height: 18px; }

  .panel-title {
    font-size: 0.72rem;
    font-weight: 800;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
  }

  /* ── Relay row ───────────────────────── */
  .relay-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 0;
    border-bottom: 1.5px solid var(--border);
  }
  .relay-row:last-child { border-bottom: none; }

  .relay-name {
    font-size: 1.05rem;
    font-weight: 800;
  }

  .relay-state {
    font-size: 0.78rem;
    color: var(--muted);
    margin-top: 3px;
    font-weight: 700;
  }

  .state-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 3px 10px;
    border-radius: var(--radius-pill);
    font-size: 0.68rem;
    font-weight: 800;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .state-badge::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: currentColor;
  }
  .state-badge.ON { background: var(--on-soft); color: var(--on-2); }
  .state-badge.OFF { background: var(--off-soft); color: var(--off); }
  [data-theme="dark"] .state-badge.ON { color: var(--on); }

  /* ── Toggle switch ───────────────────── */
  .toggle-wrap { flex: 0 0 auto; }
  .toggle-input { display: none; }

  .toggle-track {
    display: block;
    width: 58px;
    height: 32px;
    border-radius: var(--radius-pill);
    background: var(--surface-3);
    border: 2px solid var(--border);
    cursor: pointer;
    position: relative;
    transition: background 200ms ease, border-color 200ms ease;
    touch-action: manipulation;
  }

  .toggle-track::after {
    content: "";
    position: absolute;
    top: 2px;
    left: 2px;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 2px 6px rgba(0,0,0,0.18);
    transition: transform 200ms ease;
  }

  .toggle-input:checked + .toggle-track {
    background: var(--on);
    border-color: var(--on);
  }

  .toggle-input:checked + .toggle-track::after {
    transform: translateX(26px);
  }

  .toggle-input:disabled + .toggle-track {
    opacity: 0.4;
    cursor: not-allowed;
  }

  /* ── Timer form ──────────────────────── */
  .timer-grid {
    display: grid;
    gap: 14px;
  }

  .field-label {
    font-size: 0.78rem;
    font-weight: 800;
    letter-spacing: 0.06em;
    color: var(--muted);
    margin-bottom: 6px;
  }

  select, input[type="number"] {
    width: 100%;
    height: 50px;
    border-radius: var(--radius);
    border: 1.5px solid var(--border);
    background: var(--surface-2);
    color: var(--text);
    font-size: 0.96rem;
    font-weight: 700;
    padding: 0 14px;
    appearance: none;
    outline: none;
    transition: border-color 160ms ease, box-shadow 160ms ease;
  }

  select:focus, input[type="number"]:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-ring);
  }

  /* ── Buttons ─────────────────────────── */
  .btn-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 4px;
  }

  button {
    height: 50px;
    border-radius: var(--radius);
    border: none;
    font-size: 0.92rem;
    font-weight: 800;
    cursor: pointer;
    transition: opacity 160ms ease, transform 120ms ease, box-shadow 160ms ease;
    touch-action: manipulation;
  }
  button:active { transform: scale(0.97); }
  button:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  .btn-start {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff;
    box-shadow: 0 4px 12px var(--accent-ring);
  }
  .btn-start:hover { box-shadow: 0 6px 16px var(--accent-ring); }

  .btn-cancel {
    background: var(--surface-2);
    color: var(--text-2);
    border: 1.5px solid var(--border);
  }
  .btn-cancel:hover { border-color: var(--border-strong); }

  /* ── Timer status chip ───────────────── */
  .timer-status {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    border-radius: var(--radius-sm);
    background: var(--surface-2);
    border: 1.5px solid var(--border);
    font-size: 0.86rem;
    font-weight: 700;
    color: var(--muted);
  }

  .timer-status.running {
    background: var(--warn-soft);
    border-color: transparent;
    color: var(--warn);
  }

  .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: currentColor;
    flex: 0 0 auto;
  }

  /* ── Toast ───────────────────────────── */
  .toast {
    position: fixed;
    left: 50%;
    bottom: 28px;
    transform: translateX(-50%);
    opacity: 0;
    pointer-events: none;
    padding: 14px 22px;
    border-radius: var(--radius);
    background: #1a1f36;
    color: #fff;
    font-size: 0.92rem;
    font-weight: 600;
    box-shadow: 0 22px 44px rgba(0, 0, 0, 0.3);
    z-index: 1000;
    max-width: min(92vw, 480px);
    transition: opacity 220ms ease, transform 220ms ease;
  }
  .toast.show { opacity: 1; transform: translate(-50%, -8px); }

  /* ── Responsive ──────────────────────── */
  @media (max-width: 520px) {
    .panel { padding: 16px; }
    .topbar { padding: 12px 16px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>

<!-- SVG icon sprite -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-home" viewBox="0 0 24 24">
      <path d="M3 11l9-8 9 8v10a2 2 0 0 1-2 2h-4v-7h-6v7H5a2 2 0 0 1-2-2V11z" />
    </symbol>
    <symbol id="i-power" viewBox="0 0 24 24">
      <path d="M18.36 6.64a9 9 0 1 1-12.73 0" />
      <line x1="12" y1="2" x2="12" y2="12" />
    </symbol>
    <symbol id="i-clock" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="10" />
      <polyline points="12 6 12 12 16 14" />
    </symbol>
    <symbol id="i-sun" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="4" />
      <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" />
    </symbol>
    <symbol id="i-moon" viewBox="0 0 24 24">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
    </symbol>
  </defs>
</svg>

<header class="topbar">
  <div class="brand">
    <div class="brand-mark"><svg class="icon"><use href="#i-home" /></svg></div>
    <div class="brand-name">TARSHID</div>
  </div>
  <button id="themeToggle" class="icon-btn" type="button" aria-label="Toggle theme">
    <svg class="icon"><use href="#i-moon" /></svg>
  </button>
</header>

<div id="conn" class="conn">Connecting…</div>

<!-- Relay Control -->
<div class="panel">
  <div class="panel-head">
    <div class="panel-icon"><svg class="icon"><use href="#i-power" /></svg></div>
    <div class="panel-title">Relay Control</div>
  </div>
  <div id="relayContainer"></div>
</div>

<!-- Timer -->
<div class="panel">
  <div class="panel-head">
    <div class="panel-icon"><svg class="icon"><use href="#i-clock" /></svg></div>
    <div class="panel-title">Timer</div>
  </div>
  <div class="timer-grid">
    <div>
      <div class="field-label">Relay</div>
      <select id="timerChannel"></select>
    </div>
    <div>
      <div class="field-label">Duration (minutes)</div>
      <input id="timerMinutes" type="number" min="1" step="1" value="5">
    </div>
    <div id="timerStatus" class="timer-status">
      <span class="dot"></span>
      <span id="timerStatusText">No active timer</span>
    </div>
    <div class="btn-row">
      <button id="startBtn" class="btn-start">Start</button>
      <button id="cancelBtn" class="btn-cancel">Cancel</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
  /* ── Theme toggle (unified with index.html) ── */
  const themeBtn = document.getElementById("themeToggle");
  function applyTheme(t) {
    document.documentElement.setAttribute("data-theme", t);
    localStorage.setItem("theme", t);
  }
  (function initTheme() {
    const saved = localStorage.getItem("theme");
    if (saved) { applyTheme(saved); return; }
    if (window.matchMedia("(prefers-color-scheme: dark)").matches) applyTheme("dark");
  })();
  themeBtn.addEventListener("click", () => {
    applyTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark");
  });

  /* ── State ──────────────────────────────── */
  let socket = null;
  let ready  = false;
  let state  = null;
  let reconnHandle = null;
  let reconnDelay  = 1800;
  let serverOffset = 0;

  const connEl      = document.getElementById("conn");
  const relayEl     = document.getElementById("relayContainer");
  const timerCh     = document.getElementById("timerChannel");
  const timerMin    = document.getElementById("timerMinutes");
  const startBtn    = document.getElementById("startBtn");
  const cancelBtn   = document.getElementById("cancelBtn");
  const timerStatus = document.getElementById("timerStatus");
  const timerText   = document.getElementById("timerStatusText");

  /* ── Helpers ────────────────────────────── */
  function now() { return Math.floor(Date.now() / 1000 + serverOffset); }

  function fmtRemaining(sec) {
    if (sec <= 0) return "Ending…";
    const m = Math.floor(sec / 60), s = sec % 60;
    return `${m}m ${s}s left`;
  }

  function escapeHtml(value) {
    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function relayIndex(relay, fallbackIndex) {
    return Number.isInteger(Number(relay && relay.index)) ? Number(relay.index) : fallbackIndex;
  }

  function relayDisplayName(relay, fallbackIndex) {
    if (relay && relay.name) return relay.name;
    return `Relay ${relayIndex(relay, fallbackIndex) + 1}`;
  }

  function selectedRelayExists(channel) {
    return state && Array.isArray(state.relays)
      && state.relays.some((relay, i) => relayIndex(relay, i) === channel);
  }

  function relayByChannel(channel) {
    if (!state || !Array.isArray(state.relays)) return null;
    return state.relays.find((relay, i) => relayIndex(relay, i) === channel) || null;
  }

  function syncRelaySelectOptions() {
    if (!state || !Array.isArray(state.relays)) return;
    const selected = timerCh.value;
    timerCh.innerHTML = state.relays.map((relay, i) => {
      const index = relayIndex(relay, i);
      return `<option value="${index}">${escapeHtml(relayDisplayName(relay, i))}</option>`;
    }).join("");
    if (selectedRelayExists(Number(selected))) timerCh.value = selected;
  }

  /* ── Render ─────────────────────────────── */
  function render() {
    if (!state || !Array.isArray(state.relays)) return;
    const locked = !!state.nightLock;
    syncRelaySelectOptions();

    /* relay rows */
    relayEl.innerHTML = state.relays.map((r, i) => {
      const on = r.state === "ON";
      const index = relayIndex(r, i);
      const name = relayDisplayName(r, i);
      return `
        <div class="relay-row">
          <div>
            <div class="relay-name">${escapeHtml(name)}</div>
            <span class="state-badge ${on ? "ON" : "OFF"}">${on ? "ON" : "OFF"}</span>
          </div>
          <label class="toggle-wrap">
            <input class="toggle-input" type="checkbox" id="tog${index}"
              ${on ? "checked" : ""}
              ${locked && !on ? "disabled" : ""}
              onchange="toggleRelay(${index}, this.checked)">
            <span class="toggle-track"></span>
          </label>
        </div>`;
    }).join("");

    /* timer status (show for selected relay) */
    const ch = Number(timerCh.value);
    const relay = relayByChannel(ch);
    if (relay && relay.timerActive && relay.timerEnd) {
      const rem = relay.timerEnd - now();
      timerStatus.className = "timer-status running";
      timerText.textContent = fmtRemaining(rem);
    } else {
      timerStatus.className = "timer-status";
      timerText.textContent = "No active timer";
    }
  }

  /* ── WebSocket ──────────────────────────── */
  function send(payload) {
    if (!ready || !socket) return false;
    socket.send(JSON.stringify(payload));
    return true;
  }

  function connect() {
    if (socket && socket.readyState <= 1) return;
    const proto = location.protocol === "https:" ? "wss" : "ws";
    socket = new WebSocket(`${proto}://${location.hostname}:81/`);

    socket.onopen = () => {
      ready = true;
      reconnDelay = 1800;
      clearTimeout(reconnHandle);
      reconnHandle = null;
      connEl.className = "conn online";
      connEl.textContent = "Live";
      const n = new Date();
      send({ type: "time_sync", epoch: Math.floor(n / 1000),
        year: n.getFullYear(), month: n.getMonth()+1, day: n.getDate(),
        hours: n.getHours(), minutes: n.getMinutes(), seconds: n.getSeconds(),
        tzOffsetMinutes: n.getTimezoneOffset() });
      send({ type: "get_state" });
    };

    socket.onmessage = ({ data }) => {
      let msg;
      try { msg = JSON.parse(data); } catch { return; }
      if (typeof msg.ts === "number") serverOffset = msg.ts - Date.now() / 1000;
      if (msg.type === "state_snapshot") { state = msg; render(); }
    };

    socket.onerror = () => { if (socket.readyState !== 3) socket.close(); };

    socket.onclose = () => {
      ready = false;
      connEl.className = "conn offline";
      connEl.textContent = "Offline";
      if (!reconnHandle) {
        reconnHandle = setTimeout(() => { reconnHandle = null; connect(); }, reconnDelay);
        reconnDelay = Math.min(reconnDelay * 2, 10000);
      }
    };
  }

  /* ── Actions ────────────────────────────── */
  window.toggleRelay = (ch, on) => {
    if (!send({ type: "set_manual", channel: ch, mode: on ? "ON" : "OFF" })) {
      /* revert optimistic toggle if offline */
      const tog = document.getElementById(`tog${ch}`);
      if (tog) tog.checked = !on;
    } else {
      send({ type: "get_state" });
    }
  };

  startBtn.addEventListener("click", () => {
    const mins = Number(timerMin.value);
    if (!mins || mins < 1) { timerMin.focus(); return; }
    const channel = Number(timerCh.value);
    if (!selectedRelayExists(channel)) return;
    const n = new Date();
    send({ type: "set_timer", channel,
      durationMinutes: mins, target: "ON",
      epoch: Math.floor(n / 1000),
      year: n.getFullYear(), month: n.getMonth()+1, day: n.getDate(),
      hours: n.getHours(), minutes: n.getMinutes(), seconds: n.getSeconds(),
      tzOffsetMinutes: n.getTimezoneOffset() });
    send({ type: "get_state" });
  });

  cancelBtn.addEventListener("click", () => {
    const channel = Number(timerCh.value);
    if (!selectedRelayExists(channel)) return;
    send({ type: "cancel_timer", channel });
    send({ type: "get_state" });
  });

  timerCh.addEventListener("change", render);

  /* ── Ticker (updates remaining time every second) ── */
  setInterval(() => { if (state) render(); }, 1000);

  /* ── Bootstrap ──────────────────────────── */
  // AUTH GUARD: verify this user is authenticated AND restricted before
  // showing the page. Non-restricted users are sent to the full dashboard;
  // unauthenticated users are sent to the login/unauthorized page.
  (async () => {
    try {
      const authResp = await fetch("/api/auth/status");
      const authData = await authResp.json();
      if (!authData.authenticated) {
        window.location.replace("/unauthorized.html");
        return;
      }
      if (!authData.isRestricted) {
        window.location.replace("/");
        return;
      }
    } catch {
      window.location.replace("/unauthorized.html");
      return;
    }
    try {
      const r = await fetch("/api/state");
      state = await r.json();
      render();
    } catch {}
    connect();
  })();

  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible" && !ready) connect();
  });
</script>
</body>
</html>
