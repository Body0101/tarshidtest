name: Deploy Online Dashboard

on:
  push:
    branches: [main, master]
    paths:
      - 'online/**'
      - '.github/workflows/deploy-online.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write public Supabase config
        shell: bash
        run: |
          cat > online/config.js <<'EOF'
          window.TARSHID_CONFIG = {
            supabaseUrl: "${{ secrets.SUPABASE_URL }}",
            supabaseAnonKey: "${{ secrets.SUPABASE_ANON_KEY }}"
          };
          EOF
          touch online/.nojekyll
          cp online/index.html online/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: online
      - id: deployment
        uses: actions/deploy-pages@v4
