[platformio]
src_dir = SmartHomeAutomation/src
data_dir = SmartHomeAutomation/data

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
extra_scripts = pre:scripts/inject_cloud_env.py
lib_deps =
  ; JSON parsing/serialization for state, commands, and LittleFS log payloads
  https://github.com/bblanchon/ArduinoJson.git#d4e745a
  ; WebSocketsServer.h provider for realtime browser communication
  https://github.com/Links2004/arduinoWebSockets.git#e3edca4
